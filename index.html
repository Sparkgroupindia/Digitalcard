<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ff5b00">

  <meta
    name="description"
    content="Digital Visiting Card"
  >

  <title>Digital Visiting Card</title>

  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #appFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #ffffff;
      font-family: Arial, sans-serif;
      z-index: 9999;
    }

    #loading .logo {
      width: 70px;
      height: 70px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ff7a00, #ff3d00);
      margin-bottom: 18px;
    }

    #loading b {
      font-size: 18px;
      color: #222;
    }

    #loading span {
      margin-top: 8px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="logo"></div>
    <b>Digital Visiting Card</b>
    <span>Loading...</span>
  </div>

  <iframe
    id="appFrame"
    allow="camera; microphone; clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

  <script>

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyk8z0M3jofFpOw1rpSSteprO6ZHpEkMsJe68lKB9VO6FcmOD4r8BjY6KdUDYSecx4i/exec";

    const params = new URLSearchParams(window.location.search);

    const target =
      APPS_SCRIPT_URL +
      (params.toString()
        ? "?" + params.toString()
        : "");

    const frame =
      document.getElementById("appFrame");

    frame.src = target;

    frame.addEventListener("load", function () {
      document.getElementById("loading").style.display = "none";
    });

  </script>

</body>
</html>
